[package]
name = "orchestrator"
version.workspace = true
edition.workspace = true

# StreamSpeech 编排层：对桌面客户端的 WebSocket(/stream)+ 串内部 ASR(127.0.0.1:9100)
# + vLLM(127.0.0.1:8085)。纯业务胶水,不做推理。原 streaming-speech 仓 server/orchestrator,
# 2026-06 迁入 toolkit,改走 deploy-g10 部署面板(systemd 二进制 + 自更新),不再 Docker。

[dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal", "net", "time"] }
# axum 跟随 workspace(0.8)+ ws feature:orchestrator 已并入 toolkit-server 同进程同
# 路由,必须与宿主 axum 版本一致才能 nest;WS Message 在 0.8 改用 Utf8Bytes/Bytes。
axum = { workspace = true, features = ["ws"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["env"] }
log = { workspace = true }
tracing = "0.1"
tracing-subscriber = "0.3"
# 与 toolkit 全员对齐:rusqlite 走 workspace(0.31)。原仓用 0.38 是为与 src-tauri 的
# deadpool-sqlite 对齐,迁出后该约束消失。
rusqlite = { workspace = true, features = ["bundled"] }
custom-utils = { workspace = true, features = ["updater", "trace"] }
# 嵌入 toolkit-server 模式下读取公共 LLM 层的连接配置 / 提示词目录（节 A：LLM 配置收拢）。
# 独立 bin 模式不传 pool，函数仍可工作（回退 env / app.db / 编译期默认）。
toolkit-core = { path = "../toolkit-core" }

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[features]
default = []
prod = ["custom-utils/prod"]
