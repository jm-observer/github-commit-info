[package]
name = "toolkit-worker"
version.workspace = true
edition.workspace = true

[dependencies]
egress-pool = { path = "../egress-pool" }
# 代发出站请求;cookies 特性用于 per-session 自动 cookie jar(连续登录态)。
reqwest = { workspace = true, features = ["cookies"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["env"] }
uuid = { workspace = true }
log = { workspace = true }
# Linux 守护进程能力:日志 + systemd 安装 + 自更新 + watchdog + trace。
custom-utils = { workspace = true, features = ["updater", "trace"] }
# list-egress 子命令:枚举本机网卡 IP,辅助挑选 --local-address。
if-addrs = "0.13"
# 自动 id 派生(interface/local_address → MAC)与 scan 子命令的建议 id。
mac_address = "1"

[[bin]]
name = "toolkit-worker"
path = "src/main.rs"
