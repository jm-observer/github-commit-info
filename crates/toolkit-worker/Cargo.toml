[package]
name = "toolkit-worker"
version.workspace = true
edition.workspace = true

[dependencies]
egress-pool = { path = "../egress-pool" }
# remote-exec 第一期执行内核（线格式 proto + PowerShell 执行器），见 crates/worker-core。
worker-core = { workspace = true }
# 代发出站请求;cookies 特性用于 per-session 自动 cookie jar(连续登录态)。
reqwest = { workspace = true, features = ["cookies"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal", "net", "io-util", "process", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["env"] }
uuid = { workspace = true }
# worker id 的稳定派生:sm3(物理网卡 MAC + 主机名)。
sm3 = { workspace = true }
log = { workspace = true }
# Linux 守护进程能力:日志 + systemd 安装 + 自更新 + watchdog + trace。
custom-utils = { workspace = true, features = ["updater", "trace"] }
# list-egress 子命令:枚举本机网卡 IP,辅助挑选 --local-address。
if-addrs = "0.13"
# 自动 id 派生(interface/local_address → MAC)与 scan 子命令的建议 id。
mac_address = "1"
# proxy 子命令:出站 TcpSocket 上应用 SO_BINDTODEVICE(仅 Linux,见 main.rs 的 cfg 处理)。
# bind_device 只在 `all` feature 下暴露。
socket2 = { version = "0.5", features = ["all"] }

[[bin]]
name = "toolkit-worker"
path = "src/main.rs"
