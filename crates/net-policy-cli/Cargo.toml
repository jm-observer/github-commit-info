[package]
name = "net-policy-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "net-policy"
path = "src/main.rs"

[dependencies]
net-policy-core = { path = "../net-policy-core" }
net-policy-client = { path = "../net-policy-client" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
clap = { workspace = true, features = ["env"] }
log = { workspace = true }
custom-utils = { workspace = true }
base64 = "0.21"

[features]
# prod 构建：日志写文件、stdout 保持干净（AGENTS.md）。
prod = ["custom-utils/prod"]
