[package]
name = "net-policy-agent"
version.workspace = true
edition.workspace = true

[[bin]]
name = "net-policy-agent"
path = "src/main.rs"

[dependencies]
net-policy-core = { path = "../net-policy-core" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "process", "signal"] }
log = { workspace = true }
clap = { workspace = true, features = ["env"] }
custom-utils = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
rand = "0.8"
hex = "0.4"
base64 = "0.21"
futures-util = "0.3"
tokio-tungstenite = "0.24"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
] }

[features]
# prod 构建：日志写文件、stdout 保持干净（AGENTS.md）。发布/部署须带 --features prod。
prod = ["custom-utils/prod"]
