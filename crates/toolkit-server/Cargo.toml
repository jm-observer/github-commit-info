[package]
name = "toolkit-server"
version.workspace = true
edition.workspace = true

[dependencies]
toolkit-core = { path = "../toolkit-core" }
toolkit-tasks = { path = "../toolkit-tasks" }
toolkit-llm = { workspace = true }
egress-pool = { path = "../egress-pool" }
worker-core = { workspace = true }
douyin = { path = "../douyin" }
# orchestrator(StreamSpeech 编排层)同进程挂载:其 axum 路由(/stream WS + /api/*)
# nest 到 /api/asr 下,ASR 与工具 API 共用 toolkit-server 单端口单入口。
orchestrator = { path = "../orchestrator" }
audio-clean-client = { path = "../audio-clean-client" }
asr-client = { path = "../asr-client" }
agent-session = { workspace = true }
codeloop-core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal", "net", "time", "process"] }
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws"] }
# shadow 流式发音评测中继:axum WS(对桌面端)+ tokio-tungstenite WS 客户端(连 :8098)。
tokio-tungstenite = "0.24"
futures-util = "0.3"
tower-http = { workspace = true }
clap = { workspace = true, features = ["env"] }
log = { workspace = true }
custom-utils = { workspace = true, features = ["updater", "trace", "license-sign"] }
rusqlite = { workspace = true }
reqwest = { workspace = true }
sm3 = { workspace = true }
uuid = { workspace = true }
# license 续期签名（signer.rs 直接持有 SigningKey 类型）；版本/feature 与 custom-utils 的
# ed25519-dalek 依赖对齐（license-sign feature 里那份），避免类型不一致。
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# 软件授权 · 临期邮件提醒（alerts.rs，设计 §4.3/§7）：异步 SMTP，禁默认 feature 避免拉 openssl，
# 走 rustls + tokio1 运行时。
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

[dev-dependencies]
reqwest = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "time"] }

[features]
default = []
prod = ["custom-utils/prod"]

[[bin]]
name = "toolkit-server"
path = "src/main.rs"
