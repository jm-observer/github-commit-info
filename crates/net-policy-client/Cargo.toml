[package]
name = "net-policy-client"
version.workspace = true
edition.workspace = true

# 普通权限命名管道客户端库：连管道、请求/响应、版本协商、事件订阅、断线重连。
# Tauri 后端与 CLI 都复用它。仅依赖 core::protocol（不拉全 core 的重逻辑）。
[dependencies]
net-policy-core = { path = "../net-policy-core" }
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
log = { workspace = true }
