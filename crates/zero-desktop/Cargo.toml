[package]
name = "zero-desktop"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
# screenshot 模块：全局热键唤起截图
tauri-plugin-global-shortcut = "2"
# 单实例保护：杜绝两个进程互抢全局热键 / workspace，并杜绝「看不见的旧进程」
# （截图 overlay 是 skip_taskbar 窗，旧进程残留时任务栏无迹可寻）。
tauri-plugin-single-instance = "2"
# screenshot 模块：把抓屏 BGRA 像素编码成 PNG（轻量，不引整套 image）
png = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "io-util"] }
anyhow = { workspace = true }
log = { workspace = true }
clap = { workspace = true, features = ["env"] }
custom-utils = { workspace = true, features = ["updater", "trace"] }
# Cookie 模块依赖
reqwest = { workspace = true }
chrono = { workspace = true }
sha2 = "0.10"
hex = "0.4"
rusqlite = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
headless_chrome = "1.0"
tracing = "0.1"
rand = "0.8"
base64 = "0.21"
# Speech 模块依赖
cpal = "0.16"
# 外网档 ASR 是 wss://（经 caddy TLS 终止）；默认特性不含 TLS，连 wss 会报
# "TLS support not compiled in"。与 workspace reqwest 一致走 rustls，不引 native-tls。
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# rustls 0.23 的进程级 CryptoProvider 需在 main 里显式安装（见 main.rs 开头注释）。
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
# Music 模块依赖（原生音频引擎：解码 / 输出 / 重采样 / 元数据 / 无锁环形缓冲）
symphonia = { version = "0.6", features = [
    "flac", "mp3", "aac", "alac", "isomp4", "ogg", "vorbis", "wav", "pcm",
] }
rubato = "0.16"
rtrb = "0.3"
lofty = "0.24"
crossbeam-channel = "0.5"
pinyin = "0.11.0"

[dev-dependencies]
# screenshot 元数据 sidecar 的单测：临时 workspace 目录
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    # screenshot 模块：GDI 抓屏 + 显示器定位（BitBlt/GetDIBits/MonitorFromPoint…）
    "Win32_Graphics_Gdi",
    # screenshot 模块：高 DPI 感知（P2 缩放打磨用，先纳入）
    "Win32_UI_HiDpi",
    # screenshot 模块：剪贴板 CF_DIB 直写（tauri-plugin-clipboard-manager 的 CF_DIBV5
    # 在微信等挑食程序里读不出，落回 Win32 SetClipboardData(CF_DIB)）
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
wasapi = "0.23"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
prod = ["custom-utils/prod"]

[[bin]]
name = "zero-desktop"
path = "src/main.rs"
