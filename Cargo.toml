[workspace]
members = [
    "crates/github-commit-info",
    "crates/hf-watcher",
    "crates/asr-client",
    "crates/audio-clean-client",
    "crates/douyin",
    "crates/rag",
    "crates/toolkit-core",
    "crates/toolkit-tasks",
    "crates/toolkit-llm",
    "crates/toolkit-server",
    "crates/zero-desktop",
    "crates/orchestrator",
    "crates/egress-pool",
    "crates/egress-client",
    "crates/toolkit-worker",
    "crates/worker-core",
    "crates/egress-tester",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"

[workspace.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "multipart", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
log = "0.4"
clap = { version = "4.5", features = ["derive"] }
custom-utils = { version = "0.16.0", features = ["updater", "trace"] }
anyhow = "1"
sm3 = "0.4"
axum = "0.8"
async-trait = "0.1"
rusqlite = { version = "0.31", default-features = false, features = ["bundled"] }
sqlite-vec = "0.1"
r2d2 = "0.8"
r2d2_sqlite = "0.24"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
toolkit-llm = { path = "crates/toolkit-llm" }
worker-core = { path = "crates/worker-core" }

[profile.release]
strip = true
#lto = true
lto = "thin"
codegen-units = 16   # 默认 release 是 1，配合并行加速

# custom-utils 的 license feature（license-sign 等）尚未发布到 crates.io（0.16.0 已发布版本
# 不含 license 模块），toolkit-server 需要它做在线续期签发。临时 patch 到本机同级路径；
# 待 custom-utils 发新版本带上 license feature 后可删除本节，改回纯版本号依赖。
[patch.crates-io]
custom-utils = { path = "../custom-utils" }