# cargo-make 任务集（`cargo install cargo-make` 后用 `cargo make <task>`）。
#
# zero-desktop 是 Tauri 应用：release 走 `cargo tauri build`（在 crate 目录执行），它会
# 自动跑 tauri.conf.json 的 beforeBuildCommand（npm run build → ui/dist）再出 release
# 二进制 + 安装包，无需在此手动调前端构建。

[config]
# 任务在仓库根执行，不对每个 workspace 成员逐一展开。
default_to_workspace = false

# ── zero-desktop ──────────────────────────────────────────────────────────────

[tasks.install]
description = "安装 zero-desktop 前端依赖（依赖变更时跑一次即可；cargo tauri build 的 beforeBuildCommand 需要 node_modules）"
cwd = "crates/zero-desktop/ui"
# Windows 上 npm 是 npm.cmd（非 .exe），cargo-make 的进程调用不会自动补 .cmd 后缀，
# 直接 command="npm" 会报 program not found；走 @shell 由 shell 解析即可。
script_runner = "@shell"
script = "npm install"

[tasks.build]
description = "release 编译 zero-desktop（cargo tauri build：前端构建 + Rust release + 安装包）"
cwd = "crates/zero-desktop"
command = "cargo"
args = ["tauri", "build"]

[tasks.dev]
cwd = "crates/zero-desktop"
command = "cargo"
args = ["tauri", "dev"]
[tasks.dev-no]
cwd = "crates/zero-desktop"
command = "cargo"
args = ["tauri", "dev", "--no-watch"]

# ── net-policy-gui ────────────────────────────────────────────────────────────

[tasks.package-net-policy]
description = "打包 net-policy-gui 一体化 NSIS 安装程序（GUI + agent + mihomo + 内置 Rust MITM）"
command = "pwsh"
args = ["-NoProfile", "-File", "${CARGO_MAKE_WORKING_DIRECTORY}/package-net-policy.ps1"]

[tasks.package-net-policy-debug]
description = "Debug 编译并打包 net-policy-gui 一体化 NSIS 安装程序（用于本地调试）"
command = "pwsh"
args = ["-NoProfile", "-File", "${CARGO_MAKE_WORKING_DIRECTORY}/package-net-policy.ps1", "-Debug"]

[tasks.worker]
command = "cargo"
args = ["build", "-p", "toolkit-worker", "--features", "custom-utils/prod"]
